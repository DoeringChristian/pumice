name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (collaboration server tests) needs Node 22.5+.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:excalidraw
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @pumice/web
      - run: npm run build -w @pumice/mobile
      - run: npm run build -w @pumice/desktop
      - run: npm run docs:api

  package:
    # Unsigned packages on every push to main; signing secrets turn on signed builds.
    if: github.ref == 'refs/heads/main'
    needs: check
    strategy:
      # One system failing to package says nothing about the others: let them finish.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:excalidraw
      - run: npm exec -w @pumice/desktop -- electron-vite build
        # Plotly is one large file: more memory than the runner's default to bundle it.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Without signing secrets the variables are empty, and an empty CSC_LINK is taken for a
      # certificate file that does not exist: leave out what is not set.
      - shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npm exec -w @pumice/desktop -- electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: pumice-${{ matrix.os }}
          path: apps/desktop/release/*/*.*
