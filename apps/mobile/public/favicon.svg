<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0774a"/>
      <stop offset="1" stop-color="#b84a22"/>
    </linearGradient>
    <linearGradient id="stone" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#e6ddd0"/>
    </linearGradient>
    <linearGradient id="pore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f3515"/>
      <stop offset="1" stop-color="#b9502a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a1f08" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon shape: 824px rounded square on a 1024 canvas -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <!-- the pumice stone -->
  <g filter="url(#shadow)">
    <path fill="url(#stone)" d="M286 478C272 352 396 262 536 284C684 296 800 392 780 540C768 668 648 756 500 744C362 744 296 628 286 478Z"/>
  </g>
  <!-- pores -->
  <g fill="url(#pore)">
    <ellipse cx="520" cy="520" rx="66" ry="58"/>
    <ellipse cx="424" cy="424" rx="48" ry="42" transform="rotate(-18 424 424)"/>
    <ellipse cx="654" cy="474" rx="54" ry="47" transform="rotate(14 654 474)"/>
    <ellipse cx="558" cy="392" rx="31" ry="27"/>
    <ellipse cx="612" cy="624" rx="42" ry="36" transform="rotate(-10 612 624)"/>
    <ellipse cx="398" cy="566" rx="36" ry="31" transform="rotate(20 398 566)"/>
    <ellipse cx="482" cy="656" rx="27" ry="23"/>
    <ellipse cx="704" cy="584" rx="23" ry="20"/>
    <ellipse cx="354" cy="482" rx="18" ry="16"/>
    <ellipse cx="484" cy="350" rx="15" ry="13"/>
  </g>
</svg>
